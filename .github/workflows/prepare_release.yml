---
name: 'Prepare Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to be released (e.g., 10.1.2.0-2)'
        required: true
        type: string
      branch:
        description: 'The branch to release from.'
        type: choice
        options:
          - main
          - '10.0.x'
          - '9.4.x'
          - '9.3.x'
          - '9.2.x'
        default: 'main'

permissions: {}

jobs:
  prepare_release:
    uses: 'openvoxproject/shared-actions/.github/workflows/prepare_release.yml@main'
    with:
      version: ${{ inputs.version }}
      base-branch: ${{ inputs.branch }}
    secrets:
      github_pat: ${{ secrets.OPENVOXBOT_COMMIT_AND_PRS }}
      ssh_private_key: ${{ secrets.OPENVOXBOT_SSH_PRIVATE_KEY }}
